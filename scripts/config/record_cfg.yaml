record:
  repo_id: &repo_id "flexiv_dual_arm_3d/pick_place"
  # repo_id: &repo_id "nero_task3_step1/2mL_empty_right"
  # Suggested format: <robot_task<num>_step<num>>/<description>, e.g. nero_task3_step1/2mL_empty
  # <description>: https://github.com/wbcdcompetition/wbcd_tasks/tree/main/track-3-lab-experiments
  #   step1:
  #     2mL_empty: Seat a 2 mL vial into the 2 mL empty rack
  #     2ml_filled: Seat a filled 2 mL vial into the 2 mL filled rack
  #     8mL_empty: Seat an 8 mL vial into the 8 mL empty rack
  #     8mL_filled: Seat a filled 8 mL vial into the 8 mL filled rack
  #   step2 opc
  #   step3:
  #     remove_cap: Remove the cap from the source bottle
  #     remove_tubing: Remove the tubing from the source bottle
  #     insert_tubing: Insert the tubing into the target bottle
  #     replace_cap: Replace the cap on the source bottle

  debug:
    robot_debug: false # if true, robot will not execute arm actions, but gripper can still be controlled
  user_notes: "Flexiv Rizon4s dual-arm Oculus teleop template; fill serial numbers and cameras before real collection."
  # user_notes:  # any additional notes about the dataset
  fps: 30 # dataset and camera frame rate
  run_mode: "run_record" # run_record | run_policy | run_mix
  save_depth_sidecar: true # save native RealSense uint16 depth in the selected raw sidecar
  save_ir_sidecar: true # save raw left/right RealSense uint8 IR in the selected raw sidecar
  save_rgbd_timestamps: true # save global_frame_index, robot_timestamp, and per-camera RealSense timestamps
  rgbd_sidecar_storage: "zarr" # zarr (default streaming Zarr v2) | parquet (legacy compatibility)
  rgbd_sidecar_zarr:
    relative_path: "sidecars/realsense.zarr"
    chunk_frames: 8
    queue_capacity_frames: 64
    compressor:
      codec: "blosc"
      cname: "lz4"
      clevel: 1
      shuffle: "bitshuffle"
  rgb_camera_name_mode: "rgb" # rgb -> head_rgb/left_wrist_rgb/right_wrist_rgb; legacy_image keeps old *_image keys for old checkpoints

  # Robot type selection. Supported robots: dobot_dual_arm, franka_dual_arm, nero_dual_arm, arx_dual_arm, flexiv_dual_arm, franka.
  # Hardware-specific teleop / robot / cameras sections are loaded from scripts/config/robots by robot_type.
  robot_type: &robot_type "flexiv_dual_arm"
  # robot_type: &robot_type "nero_dual_arm"

  # Optional explicit override if you do not want the robot_type default mapping:
  # das_config_path: scripts/config/robots/dobot_config.yaml
  # das_config_path: scripts/config/robots/franka_config.yaml
  # das_config_path: scripts/config/robots/nero_cofig.yaml
  # das_config_path: scripts/config/robots/arx_config.yaml

  policy:
    # 策略类型: act | diffusion | dp | diffusion_policy
    # 轮次式 DAgger 的 run_mix 采集目前只实现 ACT checkpoint 推理。

    # Franka:
    # For ACT:
    type: "act"
    config_path: scripts/config/policies/act_reason_config.yaml
    pretrained_path: "/home/deepcybo/flexiv_ws/dual_arm_teleop/outputs/train/franka_dual_arm_test/pick_place_20260703_E10/checkpoints/008000/pretrained_model"

    # For diffusion:
    # type: "diffusion"
    # config_path: scripts/config/policies/diffusion_reason_config.yaml
    # pretrained_path: "/home/deepcybo/Le-nero/outputs/train/franka_dual_arm/dp_left_right_pick_20260529_E150/checkpoints/last/pretrained_model"

    # Nero:
    # For ACT:
    # type: "act"
    # config_path: scripts/config/policies/act_reason_config.yaml
    # pretrained_path: "/home/deepcybo/Le-nero/outputs/train/nero_dual_arm/left_right_pick/act_20260520_E50_V01_2/checkpoints/last/pretrained_model"
    # type: "diffusion"
    # config_path: scripts/config/policies/diffusion_reason_config.yaml
    # pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1/2mL_empty_right/dp_20260523_E249_LastFrames0/checkpoints/last/pretrained_model"

    # Policy hyperparameters live in scripts/config/policies/*_reason_config.yaml.

  task:
    description: "pick up small vials and insert them in the empty rack" # task description
    num_episodes: 10 # number of episodes to record
    display: true # whether to display data during recording
    resume: false # whether to resume from an existing dataset
    resume_dataset: "flexiv_dual_arm_3d/pick_place_20260713_v03" # dataset to resume from if resume is true
    # robot-dagger sets success_policy automatically for full_success_episode/hybrid.
    # explicit prompts y/n; recorded_is_success saves every kept episode as success=true.
    success_policy:
    annotate_success: false # ask after each run_mix episode and write a per-frame success flag

  time:
    episode_time_sec: 6000 # max time per episode in seconds
    reset_time_sec: 6000 # max time to reset between episodes in seconds
    save_meta_period: 1 # save metadata after every N episodes

  storage:
    push_to_hub: false # whether to push the dataset to your HuggingFace repo after recording

replay:
  dataset_name: flexiv_dual_arm_test/pick_place_20260703_v02
  # dataset_name: nero_task3_step1/2mL_empty_20260430_v01
  episode_idx: 9 # episode index to replay
  # episode_idx: 15
  reset_on_finish: true # replay结束后回home
  disconnect_on_finish: false # 默认不断开，避免触发server stop/e-stop
  robot_type: *robot_type # robot details are loaded from scripts/config/robots by robot_type

visualize:
  dataset_name: flexiv_dual_arm_test/pick_place_20260703_v02
  # dataset_name: nero_task3_step1/2mL_empty_20260430_v01
  episode_index: 0 # episode index to visualize
  # episode_index: 15
