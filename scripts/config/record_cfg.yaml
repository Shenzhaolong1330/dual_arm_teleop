record:
  repo_id: &repo_id "franka_dual_arm/B-CARE"
  # repo_id: &repo_id "franka_dual_arm/insert_tube_rack_hard" # dataset repo name on HuggingFace
  # Suggested format: <robot_task<num>_step<num>>/<description>, e.g. nero_task3_step1/2mL_empty


  debug:
    robot_debug: false # if true, robot will not execute arm actions, but gripper can still be controlled
  user_notes: "Dual-arm task: pick up a test tube and place it into the test tube rack."
  fps: 30 # dataset and camera frame rate
  run_mode: "run_policy" # run_record | run_policy | run_mix

  # Robot type selection. Supported robots: dobot_dual_arm, franka_dual_arm, nero_dual_arm, arx_dual_arm, flexiv_dual_arm, franka.
  # Hardware-specific teleop / robot / cameras sections are loaded from scripts/config/robots by robot_type.
  robot_type: &robot_type "franka_dual_arm"
  # robot_type: &robot_type "nero_dual_arm"

  # Optional explicit override if you do not want the robot_type default mapping:
  # das_config_path: scripts/config/robots/dobot_config.yaml
  # das_config_path: scripts/config/robots/franka_config.yaml
  # das_config_path: scripts/config/robots/nero_cofig.yaml
  # das_config_path: scripts/config/robots/arx_config.yaml

  policy:
    # 策略类型: act | grasp_act | diffusion | dp | diffusion_policy
    # 轮次式 DAgger 的 run_mix 采集目前只实现 ACT checkpoint 推理。

    # Franka:
    # For ACT:
    type: "act"
    config_path: scripts/config/policies/act_reason_config.yaml
    pretrained_path: "/home/deepcybo/agent_ws/Le-nero/dual_arm_teleop/outputs/train/franka_dual_arm/act_insert_tube_0831/checkpoints/last/pretrained_model"

    # For diffusion:
    # type: "diffusion"
    # config_path: scripts/config/policies/diffusion_reason_config.yaml
    # pretrained_path: "/home/deepcybo/agent_ws/Le-nero/dual_arm_teleop/outputs/train/franka_dual_arm/diffusion_insert_tube_0831/checkpoints/last/pretrained_model"

    # Nero:
    # For ACT:
    # type: "act"
    # config_path: scripts/config/policies/act_reason_config.yaml
    # pretrained_path: "/home/deepcybo/Le-nero/outputs/train/nero_dual_arm/left_right_pick/act_20260520_E50_V01_2/checkpoints/last/pretrained_model"
    # type: "diffusion"
    # config_path: scripts/config/policies/diffusion_reason_config.yaml
    # pretrained_path: "/home/deepcybo/wbcd_ws/Le-nero/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1/2mL_empty_right/dp_20260523_E249_LastFrames0/checkpoints/last/pretrained_model"

    # Policy hyperparameters live in scripts/config/policies/*_reason_config.yaml.

  task:
    description: "use both arms to pick up a test tube and place it into the test tube rack" # task description
    num_episodes: 50 # number of episodes to record
    display: true # whether to display data during recording
    resume: false # whether to resume from an existing dataset
    resume_dataset: # dataset to resume from if resume is true
    # robot-dagger sets success_policy automatically for full_success_episode/hybrid.
    # explicit prompts y/n; recorded_is_success saves every kept episode as success=true.
    success_policy:
    annotate_success: false # ask after each run_mix episode and write a per-frame success flag

  time:
    episode_time_sec: 6000 # max time per episode in seconds
    reset_time_sec: 6000 # max time to reset between episodes in seconds
    save_meta_period: 1 # save metadata after every N episodes

  storage:
    push_to_hub: false # whether to push the dataset to your HuggingFace repo after recording

replay:
  dataset_name: franka_dual_arm/insert_tube_rack_all_E1984_gripper_relabel_v01
  episode_idx: 24 # episode index to replay
  reset_on_finish: true # replay结束后回home
  disconnect_on_finish: false # 默认不断开，避免触发server stop/e-stop
  robot_type: *robot_type # robot details are loaded from scripts/config/robots by robot_type

visualize:
  dataset_name: franka_dual_arm/insert_tube_rack_all_E1984_gripper_relabel_v01
  episode_index: 29 # episode index to visualize
