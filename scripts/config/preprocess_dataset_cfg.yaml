preprocess_dataset:
  source:
    repo_id: "franka_dual_arm/left_right_pick_merged_E150_evorl_28d"
    root: "/home/deepcybo/.cache/huggingface/lerobot/franka_dual_arm/left_right_pick_merged_E150_evorl_28d"
    episodes: null        # null means all episodes, or set e.g. [0, 1, 2]
    max_episodes: null    # optional quick-test limit

  output:
    repo_id: "franka_dual_arm/left_right_pick_merged_E150_evorl_28d_cleaned"
    root: "/home/deepcybo/.cache/huggingface/lerobot/franka_dual_arm/left_right_pick_merged_E150_evorl_28d_cleaned"
    overwrite: false
    image_writer_threads: 8
    batch_encoding_size: 4

  dry_run: false

  # 1) Compress long no-motion spans. Prefer robot state rate over action==0.
  # Gripper state changes count as motion even if arm pose/joints do not move.
  static_trim:
    enabled: true
    motion_source: "state_rate"  # state_rate | action_delta
    # Only compress/delete continuous static spans that are at least this long.
    min_static_frames: 10
    keep_start_frames: 5
    keep_end_frames: 5
    state_rate:
      ignore_gripper: false
      # Force/wrench fields are excluded from motion detection by default.
      # Set true only when raw force feedback is an intentional split signal.
      include_force: false
      # Units are per second because the tool multiplies frame-to-frame state
      # differences by dataset fps. Use small eps-like thresholds to approximate
      # state_rate == 0 while tolerating tiny serialization noise.
      joint_norm_threshold: 0.000001
      translation_norm_threshold: 0.000001
      rotation_norm_threshold: 0.000001
      gripper_norm_threshold: 0.000001
      norm_threshold: 0.000001
    # Fallback only when observation.state is unavailable.
    translation_norm_threshold: 0.001
    rotation_norm_threshold: 0.005

  # 2) Smooth noisy Cartesian command labels before writing the new dataset.
  action_smoothing:
    enabled: false
    method: "median"      # one of: median, ema, median_ema
    median_window: 3      # odd number recommended
    ema_alpha: 0.35       # used by ema / median_ema
    smooth_cartesian: true
    smooth_gripper: false
    max_translation_delta: 0.06
    max_rotation_delta: 0.08

  # 3) Always preserve context around gripper open/close events.
  gripper_events:
    enabled: true
    change_threshold: 0.5
    keep_radius_frames: 15
