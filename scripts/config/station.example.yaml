# Copy to station.local.yaml (ignored by Git) beside record_cfg.yaml.
# CLI --robot-type overrides default_robot_type. Keep installation overrides
# under robots so changing embodiment cannot reuse another robot's hardware.
default_robot_type: franka_dual_arm
record:
  repo_id: "{robot_type}/B-CARE"
  run_mode: run_record
robots:
  franka_dual_arm:
    robot:
      robot_ip: "172.16.0.1"
      robot_port: 4242
  nero_dual_arm:
    robot:
      robot_ip: "192.168.2.103"
      robot_port: 4242
  # Override cameras, calibrated base transforms and installation mapping here
  # only when they differ from scripts/config/robots/*.yaml.
