# ACT (Action Chunking with Transformers) 策略配置
# 训练和部署时共享此配置文件

policy:
  type: "act"
  
  # ==================== 输入/输出结构 ====================
  n_obs_steps: 1            # 观测历史步数
  chunk_size: 10            # 动作预测块大小
  n_action_steps: 1         # 每步重新查询策略，配合时序集成避免动作块被平均得过钝

  # ==================== Transformer 架构 ====================
  dim_model: 512            # Transformer 隐藏维度
  n_heads: 8                # 注意力头数
  n_encoder_layers: 4       # 编码器层数
  n_decoder_layers: 1       # 解码器层数 (原 ACT 实现只有1层有效)
  dim_feedforward: 3200     # 前馈网络维度
  feedforward_activation: "relu"  # 前馈网络激活函数
  pre_norm: false           # 是否使用 pre-norm
  dropout: 0.1              # Dropout 率

  # ==================== VAE 相关 ====================
  use_vae: false            # 先用确定性 ACT，避免 VAE 在当前数据上继续塌到均值/零动作
  latent_dim: 32            # VAE 潜在维度
  n_vae_encoder_layers: 4   # VAE 编码器层数
  kl_weight: 0.0            # use_vae=false 时忽略

  # ==================== 视觉骨干网络 ====================
  vision_backbone: "resnet18"  # 可选: resnet18, resnet34, resnet50
  pretrained_backbone_weights: "ResNet18_Weights.IMAGENET1K_V1"  # 预训练权重
  replace_final_stride_with_dilation: false  # 是否用膨胀卷积替换最后步幅

  # ==================== 优化器 ====================
  optimizer_lr: 3.0e-5      # 学习率
  optimizer_weight_decay: 1.0e-4  # 权重衰减
  optimizer_lr_backbone: 1.0e-5   # 骨干网络学习率

  # ==================== 时序集成 (可选) ====================
  temporal_ensemble_coeff: 0.01  # 设为 0.01 启用时序集成, 此时 n_action_steps 必须为 1

  # ==================== 归一化 ====================
  normalization_mapping:
    VISUAL: "MEAN_STD"
    STATE: "MEAN_STD"
    ACTION: "MEAN_STD"
