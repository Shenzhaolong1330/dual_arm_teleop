# Diffusion Policy 策略配置
# 训练和部署时共享此配置文件

policy:
  type: "diffusion"
  
  # ==================== 输入/输出结构 ====================
  n_obs_steps: 2            # 观测历史步数
  horizon: 16               # 扩散模型预测范围
  n_action_steps: 8         # 每次执行的动作步数

  # ==================== 视觉骨干网络 ====================
  vision_backbone: "resnet18"
  crop_shape: [84, 84]      # 图像裁剪尺寸
  crop_is_random: true      # 训练时随机裁剪
  pretrained_backbone_weights: null  # 默认不使用预训练
  use_group_norm: true      # 使用 GroupNorm 替代 BatchNorm
  spatial_softmax_num_keypoints: 32  # SpatialSoftmax 关键点数
  use_separate_rgb_encoder_per_camera: false  # 每个相机使用独立编码器

  # ==================== U-Net 架构 ====================
  down_dims: [512, 1024, 2048]  # U-Net 下采样维度
  kernel_size: 5            # 卷积核大小
  n_groups: 8               # GroupNorm 组数
  diffusion_step_embed_dim: 128  # 扩散步嵌入维度
  use_film_scale_modulation: true  # FiLM 缩放调制

  # ==================== 噪声调度器 ====================
  noise_scheduler_type: "DDPM"  # 可选: "DDPM", "DDIM"
  num_train_timesteps: 100  # 训练时间步数
  beta_schedule: "squaredcos_cap_v2"  # Beta 调度
  beta_start: 0.0001        # Beta 起始值
  beta_end: 0.02            # Beta 结束值
  prediction_type: "epsilon"  # 预测类型: "epsilon" 或 "sample"
  clip_sample: true         # 是否裁剪样本
  clip_sample_range: 1.0    # 裁剪范围
  num_inference_steps: null # 推理步数 (默认等于 num_train_timesteps)

  # ==================== 损失计算 ====================
  do_mask_loss_for_padding: false  # 是否对填充动作掩码损失

  # ==================== 优化器 ====================
  optimizer_lr: 1.0e-4      # 学习率
  optimizer_betas: [0.95, 0.999]  # Adam betas
  optimizer_eps: 1.0e-8     # Adam eps
  optimizer_weight_decay: 1.0e-6  # 权重衰减

  # ==================== 学习率调度器 ====================
  scheduler_name: "cosine"  # 调度器名称
  scheduler_warmup_steps: 500  # 预热步数

  # ==================== 归一化 ====================
  normalization_mapping:
    VISUAL: "MEAN_STD"
    STATE: "MIN_MAX"
    ACTION: "MIN_MAX"
