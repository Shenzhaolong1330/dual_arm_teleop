train:
  training:
    device: cuda # cuda / cpu / auto; priority is higher than policy.device
    gpu:
      enabled: true
      visible_devices: "0" # same effect as CUDA_VISIBLE_DEVICES; empty string keeps the current environment
      max_num_gpus: 1 # when multiple GPUs are visible, keep the first N
      memory_fraction: 0.70 # PyTorch per-process CUDA memory cap; null means no cap
      allow_tf32: true
      cudnn_benchmark: false
      empty_cache_on_start: true
      log_gpu_info: true
      fail_if_cuda_unavailable: false

  dataset:
    repo_id: "flexiv_dual_arm_test/pick_place" # HuggingFace dataset repo_id, format "username/dataset_name"
    # repo_id: "nero_task3_step1/2mL_empty_right_merged_20260521_E249"
    # Local dataset directory. It should point to the dataset repo root.
    root: "/home/deepcybo/.cache/huggingface/lerobot/flexiv_dual_arm_test/pick_place_20260703_v02"
    # root: "/home/geist/.cache/huggingface/lerobot/nero_task3_step1/2mL_empty_right_merged_20260521_E249"
    # AV1 videos generated by preprocessing can be fragile with torchcodec in
    # multi-worker training; pyav is slower but more tolerant.
    video_backend: "torchcodec" # torchcodec | pyav | video_reader
    # If a cleaned mp4 contains a bad packet, keep training by replacing that
    # sample with a nearby readable one. This does not modify the dataset files.
    skip_bad_video_samples: true
    bad_video_sample_retries: 128

  env:

  policy:
    # Supported: act | diffusion | dp | diffusion_policy.
    # 推荐保持为普通 ACT；轮次式 DAgger 会由 run_dagger_rounds.py 在内存中注入训练参数。
    # type: "act"
    # config_path: scripts/config/policies/act_train_config.yaml
    # For diffusion:
    type: "diffusion"
    config_path: scripts/config/policies/diffusion_train_config.yaml

    # Policy hyperparameters live in scripts/config/policies/*_train_config.yaml.

  output_dir: "/home/deepcybo/flexiv_ws/dual_arm_teleop/outputs/train/franka_dual_arm_test/pick_place_20260703_E10" # model and log output directory
  # output_dir: "/home/geist/wbcd_workspace/lerobot/dual_arm_data_collection/lerobot_dual_arm_teleop/outputs/train/task3_step1/2mL_empty_right/dp_20260523_E249_Crop224"
  job_name: "act_pick_place_20260703_E10"
  # job_name: "2mL_empty_right_dp_20260523_E249_Crop224"

  resume: false
  seed: 1000
  # Number of workers for the dataloader.
  # Keep 0 for AV1 video datasets: torchvision/pyav video decoding can be
  # unstable in subprocess DataLoader workers.
  num_workers: 0
  batch_size: 32
  # batch_size: 32 # Nero historical value
  steps: 40_000
  eval_freq: 2_000
  # log_freq: 10
  log_freq: 500 # Nero historical value
  save_checkpoint: true
  # Checkpoint is saved every `save_freq` training iterations and after the last training step.
  save_freq: 4_000
  use_policy_training_preset: true

  eval:
    n_episodes: 10
    batch_size: 8

  wandb:
    enable: true
    project: "lerobot_franka"
    # project: "lerobot_nero"
    # entity: "your-wandb-username"
    # notes: "training notes"
    # run_id: "custom-run-id"
    mode: "offline" # Allowed values: online, offline, disabled. Defaults to online.
