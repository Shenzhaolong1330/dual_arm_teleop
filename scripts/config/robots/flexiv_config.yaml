# Flexiv Rizon4s dual-arm hardware-side configuration loaded by scripts/core/run_record.py
# when record.robot_type is flexiv_dual_arm.
teleop:
  control_mode: "oculus"
  dual_arm: true
  oculus_config:
    ip: "192.168.110.40"
    use_gripper: true
    left_pose_scaler: [1.5, 1.2]
    left_channel_signs: [-1, 1, 1, -1, -1, 1]
    right_pose_scaler: [1.5, 1.2]
    right_channel_signs: [1, -1, 1, 1, 1, 1]
    position_axis_order: [1, 0, 2]
    rotation_axis_order: [1, 0, 2]
    action_deadband_translation: 0.0002
    action_deadband_rotation: 0.003
    action_spike_translation: 0.05
    action_spike_rotation: 0.10
    mirror_teleop: true
    visualize_placo: false

robot:
  # Fill these with the actual serial numbers from Flexiv Elements/RDK.
  # Example format: Rizon4s-123456
  left_robot_sn: "Rizon4s-063173"
  right_robot_sn: "Rizon4s-063278"
  use_gripper: true
  # Full device names from Flexiv Elements -> Settings -> Device.
  left_gripper_name: "Flexiv-GN01"
  right_gripper_name: "Flexiv-GN01"
  switch_tool_on_connect: true
  initialize_gripper_on_connect: false
  gripper_min_width: 0.0
  gripper_max_open: 0.085
  gripper_speed: 0.1
  gripper_force: 20.0
  gripper_command_epsilon: 0.002
  action_debug: true
  action_debug_every_n: 30
  gripper_reverse: false
  close_threshold: 0.5
  enable_on_connect: true
  clear_fault_on_connect: true
  switch_cartesian_mode_on_connect: true
  go_home_on_connect: true
  reset_go_home: true
  home_plan_name: "PLAN-Home"
  left_home_joints: [-0.2143217623, 0.4432439506, -0.3244648874, 1.9288256168, 0.3240586817, 0.5997259021, 0.0735417530]
  right_home_joints: [-0.3151930571, 0.3923939764, 0.9445411563, 1.8521142006, -0.2292370796, 0.6883957386, 0.1360882968]
  home_gripper_open_fraction: 1.0
  home_joint_max_vel: 1.0
  home_joint_max_acc: 2.0
  home_joint_tolerance: 0.01
  home_joint_timeout_sec: 20.0
  zero_ft_sensor_on_connect: false
  max_cartesian_delta: 0.05
  max_rotation_delta: 0.10
  cartesian_max_linear_vel: 0.8
  cartesian_max_angular_vel: 1.2
  cartesian_max_linear_acc: 3.0
  cartesian_max_angular_acc: 6.0
  left_mount_yaw_deg: 45.0
  right_mount_yaw_deg: -45.0
  camera_read_timeout_ms: 1000
  camera_warmup_attempts: 5

cameras:
  # Replace with the RealSense serial numbers for this Flexiv station.
  left_wrist_cam_serial: "347622074728"
  right_wrist_cam_serial: "346522076690"
  head_cam_serial: "344522070241"
  width: 424
  height: 240
