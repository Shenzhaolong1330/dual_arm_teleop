# Franka hardware-side configuration loaded by scripts/core/run_record.py
# when record.robot_type is franka_dual_arm or franka.
teleop:
  control_mode: "oculus"
  dual_arm: true
  oculus_config:
    processing_profile: cross_embodiment_v1
    ip:
    use_gripper: true
    left_channel_signs: [1, 1, 1, -1, -1, 1]
    right_channel_signs: [1, 1, 1, -1, -1, 1]
    # Operator stands opposite the robot: right controller drives left arm.
    mirror_teleop: true
    visualize_placo: false

robot:
  robot_ip: "172.16.0.1"
  robot_port: 4242
  rpc_timeout_sec: 30.0
  schema_mode: "x_embodiment"
  observation_pose_frame: world # already supplied by the RPC server
  physical_calibration:
    status: controller_configured
    tcp_definition: native_controller_tcp_unqualified
    world_convention: base_midpoint_x_forward_y_left_z_up_v1
    source: 2026-11-06 read-only FrankaRobotState.F_T_EE and active torso_extrinsics.yaml
    evidence:
      left_native_tcp_in_flange:
      - 0
      - 0
      - 0.16
      - 1
      - 0
      - 0
      - 0
      right_native_tcp_in_flange:
      - 0
      - 0
      - 0.16
      - 1
      - 0
      - 0
      - 0
      base_positions_in_world_m:
        left:
        - 0
        - 0.25
        - 0
        right:
        - 0
        - -0.25
        - 0
      base_roll_in_world_deg:
        left: -45
        right: 45
    qualification_pending:
    - physical contact centre and jaw-axis convention
    - Robotiq feedback aperture calibration
  use_gripper: true
  close_threshold: 0.7
  gripper_reverse: false
  gripper_max_open: 0.085
  gripper_force: 10.0
  gripper_speed: 0.1
  open_grippers_on_connect: false
  reset_opens_grippers: true
  reset_go_home: true
  go_home_duration_sec: 5.0
  go_home_rate_hz: 50.0
  max_cartesian_delta: 0.06
  max_rotation_delta: 0.08
  action_state_log_enabled: false
  action_state_log_dir: logs/franka_action_state
  action_state_log_every_n: 1
  action_state_log_raw_rpc: false

cameras:
  left_wrist_cam_serial: "347622074336"
  right_wrist_cam_serial: "337322072568"
  head_cam_serial: "348522072761"
  width: 424
  height: 240
  # width: 640
  # height: 480
