# Franka hardware-side configuration loaded by scripts/core/run_record.py
# when record.robot_type is franka_dual_arm or franka.
teleop:
  control_mode: "oculus"
  dual_arm: true
  oculus_config:
    ip:
    use_gripper: true
    action_smoothing_alpha: 0.65
    left_pose_scaler: [0.5, 0.65]
    left_channel_signs: [1, 1, 1, -1, -1, 1]
    right_pose_scaler: [0.5, 0.65]
    right_channel_signs: [1, 1, 1, -1, -1, 1]
    action_deadband_translation: 0.0003  # meters per frame; keep fine teleop motion responsive
    action_deadband_rotation: 0.0005      # radians per frame; keep fine teleop rotation responsive
    action_spike_translation: 0.1       # meters per frame; ignore tracking jumps
    action_spike_rotation: 0.2          # radians per frame; ignore tracking jumps before Franka clipping
    mirror_teleop: true
    visualize_placo: false

robot:
  robot_ip: "172.16.0.1"
  robot_port: 4242
  rpc_timeout_sec: 30.0
  schema_mode: "nero_compatible"
  use_gripper: true
  close_threshold: 0.7
  gripper_reverse: false
  gripper_max_open: 0.085
  gripper_force: 10.0
  gripper_speed: 0.1
  open_grippers_on_connect: false
  reset_opens_grippers: true
  reset_go_home: true
  go_home_duration_sec: 5.0
  go_home_rate_hz: 50.0
  max_cartesian_delta: 0.06
  max_rotation_delta: 0.08
  action_state_log_enabled: false
  action_state_log_dir: logs/franka_action_state
  action_state_log_every_n: 1
  action_state_log_raw_rpc: false

cameras:
  left_wrist_cam_serial: "347622074336"
  right_wrist_cam_serial: "337322072568"
  head_cam_serial: "348522072761"
  width: 424
  height: 240
